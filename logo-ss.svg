<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bb33ff"/>
      <stop offset="0.45" stop-color="#8a2be2"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="160" fill="transparent"/>

  <!-- Stroke layer for readability -->
  <text x="50%" y="62%" text-anchor="middle" dominant-baseline="middle"
        font-family="'Great Vibes', 'Pacifico', 'Brush Script MT', cursive"
        font-size="140" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="10"
        style="paint-order: stroke;" >SS</text>

  <!-- Main gradient fill -->
  <text x="50%" y="62%" text-anchor="middle" dominant-baseline="middle"
        font-family="'Great Vibes', 'Pacifico', 'Brush Script MT', cursive"
        font-size="140" fill="url(#g)" filter="url(#glow)">SS</text>
</svg>
