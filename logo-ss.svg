<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bb33ff"/>
      <stop offset="0.45" stop-color="#8a2be2"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="160" fill="transparent"/>

  <!--
    Two touching S's where the right S is mirrored (backwards).
    We render 'S' twice: one normal, one mirrored around the center.
  -->

  <!-- Stroke layer for readability -->
  <g fill="none" stroke="rgba(0,0,0,0.45)" stroke-width="14" style="paint-order: stroke;">
    <!-- Left S is mirrored -->
    <text x="145" y="100" text-anchor="middle" dominant-baseline="middle"
          font-family="'Great Vibes', 'Pacifico', 'Brush Script MT', cursive"
          font-size="150"
          transform="translate(320 0) scale(-1 1)">S</text>
    <!-- Right S is normal -->
    <text x="175" y="100" text-anchor="middle" dominant-baseline="middle"
          font-family="'Great Vibes', 'Pacifico', 'Brush Script MT', cursive"
          font-size="150">S</text>
  </g>

  <!-- Main gradient fill -->
  <g fill="url(#g)">
    <text x="145" y="100" text-anchor="middle" dominant-baseline="middle"
          font-family="'Great Vibes', 'Pacifico', 'Brush Script MT', cursive"
          font-size="150"
          transform="translate(320 0) scale(-1 1)">S</text>
    <text x="175" y="100" text-anchor="middle" dominant-baseline="middle"
          font-family="'Great Vibes', 'Pacifico', 'Brush Script MT', cursive"
          font-size="150">S</text>
  </g>
</svg>
